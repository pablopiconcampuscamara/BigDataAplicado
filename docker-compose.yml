services:
# ============================================================
  # HDFS
  # ============================================================

  namenode:
    image: apache/hadoop:3.4
    container_name: namenode
    hostname: namenode
    command: >
      bash -c "
        if [ ! -d /opt/hadoop/dfs/name/current ]; then
          hdfs namenode -format -force;
        fi &&
        hdfs namenode
      "
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    ports:
      - "9870:9870"   # NameNode Web UI
      - "9000:9000"   # HDFS
    volumes:
      - namenode_data:/opt/hadoop/dfs/name
    networks:
      - bigdata

  datanode:
    image: apache/hadoop:3.4
    container_name: datanode
    hostname: datanode
    command: hdfs datanode
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    depends_on:
      - namenode
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/opt/hadoop/dfs/data
    networks:
      - bigdata


  # ============================================================
  # SPARK
  # ============================================================

  spark-master:
    image: spark:3.4.2
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"   # Spark Master
    volumes:
      - spark_data:/opt/spark
    networks:
      - bigdata

  spark-worker:
    image: spark:3.4.2
    container_name: spark-worker
    hostname: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_PORT=8081
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - spark_worker_data:/opt/spark
    networks:
      - bigdata


  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    ports:
      - "29092:29092"

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - bigdata


  # ============================================================
  # MONGODB
  # ============================================================

  mongo:
    image: mongo:7.0
    container_name: mongo
    hostname: mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: bigdata

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    networks:
      - bigdata


  # ============================================================
  # POSTGRESQL
  # ============================================================

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: bigdata

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - bigdata


  # ============================================================
  # JUPYTER / ANACONDA WORKSPACE
  # ============================================================

  workspace:
    image: continuumio/anaconda3:2024.10-1
    container_name: workspace
    hostname: workspace

    working_dir: /workspace

    command: >
      bash -c "
        pip install --no-cache-dir pyspark==3.4.2 kafka-python pymongo psycopg2-binary &&
        jupyter notebook
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --allow-root
        --NotebookApp.token=''
        --NotebookApp.password=''
      "

    environment:
      HADOOP_NAMENODE_HOST: namenode
      HADOOP_NAMENODE_PORT: 9000

      SPARK_MASTER_URL: spark://spark-master:7077

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      MONGO_HOST: mongo
      MONGO_PORT: 27017

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: bigdata
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword

    ports:
      - "8888:8888"

    volumes:
      - ./workspace:/workspace
      - jupyter_data:/root/.jupyter

    depends_on:
      - namenode
      - datanode
      - spark-master
      - spark-worker
      - kafka
      - mongo
      - postgres

    networks:
      - bigdata


# ==============================================================
# NETWORK
# ==============================================================

networks:
  bigdata:
    name: bigdata
    driver: bridge


# ==============================================================
# VOLUMES
# ==============================================================

volumes:
  namenode_data:
  datanode_data:
  spark_data:
  spark_worker_data:
  kafka_data:
  mongo_data:
  postgres_data:
  jupyter_data:
